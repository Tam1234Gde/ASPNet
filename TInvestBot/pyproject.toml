[project]
name = "tinvest-thin-client"
version = "2026.9.25.1"
description = "Deterministic T-Bank Invest API v2 execution client with remote AI decisions"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "python-dotenv>=1.0"]

[project.optional-dependencies]
tinvest = ["t-tech-investments==1.51.0"]
test = ["pytest>=8"]

[project.scripts]
tinvest-bot = "app.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
